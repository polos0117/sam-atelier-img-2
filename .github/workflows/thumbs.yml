name: 썸네일

# img/ 에 webp 를 올리면 img/thumb/ 에 목록용 축소본을 만들어 되커밋한다.
# 만드는 도구는 코드 저장소(sam-atelier)의 tools/make-thumbs.py 다 — 여기 복사해 두지
# 않고 그때그때 받아 온다. 등록(data/img.json)은 코드 저장소의 워크플로가 한다.
# 되커밋에는 [skip actions] 를 붙여 이 워크플로가 다시 돌지 않게 한다.
# 끝나면 코드 저장소의 "그림 등록" 을 깨운다 — 저장소 비밀 CODE_REPO_TOKEN 이 있을 때만.
# 토큰이 없으면 코드 저장소는 시간표(자주 빠진다)나 Run workflow 로 등록한다.
# sam-atelier-img 의 같은 워크플로를 옮겼다(2026-11-12 — 둘째 그림 저장소, 저장소 이름이 나오는 곳만 고쳤다).
on:
  push:
    branches: [main]
    paths:
      - 'img/*.webp'
  workflow_dispatch:

# 연달아 올리면 차례로 돈다. 두 실행이 같은 파일을 밀면 푸시가 깨진다
concurrency:
  group: thumbs
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  thumbs:
    runs-on: ubuntu-latest
    steps:
      # 되커밋이 밀렸을 때 rebase 를 하므로 온전한 이력이 필요하다
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/checkout@v4
        with:
          repository: polos0117/sam-atelier
          path: code

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Pillow 설치
        run: pip install --quiet Pillow

      # 체크아웃은 모든 파일의 시각이 같아서 "덮어쓴 원본" 을 시각으로는 못 알아본다.
      # 이번 푸시에서 달라진 webp 를 --redo 로 넘겨 그것은 무조건 다시 만든다
      - name: 썸네일
        id: thumbs
        # 열리지 않는 그림이 있으면 도구는 나머지를 다 만들고 2 로 끝난다 — 되커밋까지 가고, 맨 끝 단계가 실행을 빨갛게 남긴다(pkm 2026-10-27)
        continue-on-error: true
        run: |
          CHANGED=""
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            CHANGED=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" -- 'img/*.webp' | tr '\n' ' ')
          fi
          echo "다시 만들 것: ${CHANGED:-없음}"
          python3 code/tools/make-thumbs.py --redo $CHANGED

      # Pages 사이트 한 개는 1 GB 까지다. 900 MB 를 넘으면 다음 저장소(sam-atelier-img-3)를 준비할 때
      - name: 크기
        run: |
          kb=$(du -sk --exclude=.git . | cut -f1)
          echo "사이트 크기 $((kb / 1024)) MB"
          if [ "$kb" -gt 921600 ]; then echo "::warning::sam-atelier-img-2 가 900 MB 를 넘었다 — 다음 그림 저장소(sam-atelier-img-3)를 준비한다(sam-atelier 의 IMAGE_RULES.md 「그림 저장소는 여럿이다」)"; fi

      - name: 되커밋
        run: |
          if [ -z "$(git status --porcelain -- img/thumb)" ]; then
            echo "달라진 것 없음 — 커밋하지 않는다"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add img/thumb
          git commit -m "자동 썸네일 [skip actions]"
          # 사이에 다른 커밋이 들어왔으면 얹어서 다시 민다
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase origin main || exit 1
          done
          exit 1

      # 코드 저장소는 여기 푸시를 볼 수 없다. 토큰으로 직접 두드린다.
      # 토큰: github.com → Settings → Developer settings → Fine-grained tokens,
      #   저장소 sam-atelier 하나, Contents: Read and write. 그것을 이 저장소의
      #   Settings → Secrets and variables → Actions 에 CODE_REPO_TOKEN 으로 넣는다.
      - name: 코드 저장소 깨우기
        if: ${{ !cancelled() }}
        env:
          TOKEN: ${{ secrets.CODE_REPO_TOKEN }}
        run: |
          # 결과는 주석(::notice/::warning)으로도 남긴다 — 실행 기록 본문을 못 여는 곳에서도 실행 요약에 보인다
          if [ -z "$TOKEN" ]; then
            echo "::warning title=코드 저장소 깨우기::CODE_REPO_TOKEN 이 이 실행에 안 보인다 — 이 저장소(sam-atelier-img-2)의 Actions 저장소 비밀인지, 이름이 맞는지 본다. 코드 저장소는 시간표나 Run workflow 로 등록한다"
            exit 0
          fi
          code=$(curl -sS -o /tmp/dispatch.out -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/polos0117/sam-atelier/dispatches \
            -d '{"event_type":"images-updated"}')
          if [ "$code" != "204" ]; then
            echo "::warning title=코드 저장소 깨우기::토큰은 있는데 깨우기가 HTTP $code 로 막혔다 — 토큰의 저장소(sam-atelier)·권한(Contents: Read and write)·만료를 본다: $(head -c 200 /tmp/dispatch.out)"
            exit 0
          fi
          echo "::notice title=코드 저장소 깨우기::깨웠다 — sam-atelier 의 그림 등록 이 곧 돈다"

      - name: 열리지 않는 그림
        if: ${{ steps.thumbs.outcome == 'failure' }}
        run: |
          echo "::error::썸네일 단계에서 열리지 않는 그림이 있었다 — 그 단계의 ::error:: 에 적힌 그림을 다시 올린다(나머지 썸네일은 되커밋했다)"
          exit 1
